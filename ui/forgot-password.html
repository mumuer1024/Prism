<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>重置密码 - Prism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: {
              DEFAULT: '#FDFAF4',
              secondary: '#F3EAD5',
              tertiary: '#E7D0A9',
              dark: { DEFAULT: '#1C1A16', secondary: '#252118', tertiary: '#352D1E' }
            },
            accent: { DEFAULT: '#F0C06D', light: '#F5CC85', dark: '#D4A84E', text: '#6B3D00' },
            success: '#3D9E6A',
            error: '#C0392B',
            warn: '#B8730A',
            border: { DEFAULT: 'var(--border)', light: 'rgba(90,65,30,0.10)', dark: 'var(--border)' },
            text: {
              DEFAULT: '#3E2E1B',
              secondary: '#6B4E2E',
              muted: '#A8896A',
              dark: { DEFAULT: '#F0E8D4', secondary: '#C8A87A', muted: '#7A6448' }
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-bg text-text min-h-screen flex flex-col overflow-hidden transition-colors duration-300">

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="auth-card">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg" style="background: var(--accent);">
          🔐
        </div>
        <h1 class="text-xl font-bold" style="color: var(--text);">重置密码</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary);">输入注册邮箱，我们将发送重置链接</p>
      </div>

      <!-- Form -->
      <form id="forgot-form" class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">注册邮箱</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">📧</span>
            <input
              type="email"
              id="email"
              placeholder="your@email.com"
              class="auth-input pl-10"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden text-sm text-error bg-error/10 border border-error/20 rounded-lg p-3">
          <span id="error-text"></span>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden text-sm text-success bg-success/10 border border-success/20 rounded-lg p-3">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>重置邮件已发送，请检查收件箱</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="auth-btn auth-btn-primary"
        >
          <span id="submit-text">发送重置邮件</span>
          <svg id="submit-spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Back to Login -->
      <p class="text-center text-sm mt-6" style="color: var(--text-secondary);">
        想起密码了？
        <a href="/login" class="text-accent font-medium hover:underline">返回登录</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        <span class="footer-brand">🕵️ Prism</span>
        <span class="footer-version">v2.0.0</span>
      </div>
      <div class="footer-right">
        <a href="/" class="footer-link">返回首页</a>
        <span class="footer-separator">·</span>
        <button onclick="toggleTheme()" class="footer-link">切换主题</button>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-bg-secondary border border-border px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 max-w-sm">
    <span id="toast-icon"></span>
    <span id="toast-message" class="text-sm font-medium"></span>
  </div>

  <script src="/static/core.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
    });
  </script>
</body>
</html>
