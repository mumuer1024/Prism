<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>注册 - Prism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: {
              DEFAULT: '#FDFAF4',
              secondary: '#F3EAD5',
              tertiary: '#E7D0A9',
              dark: { DEFAULT: '#1C1A16', secondary: '#252118', tertiary: '#352D1E' }
            },
            accent: { DEFAULT: '#F0C06D', light: '#F5CC85', dark: '#D4A84E', text: '#6B3D00' },
            success: '#3D9E6A',
            error: '#C0392B',
            warn: '#B8730A',
            border: { DEFAULT: 'var(--border)', light: 'rgba(90,65,30,0.10)', dark: 'var(--border)' },
            text: {
              DEFAULT: '#3E2E1B',
              secondary: '#6B4E2E',
              muted: '#A8896A',
              dark: { DEFAULT: '#F0E8D4', secondary: '#C8A87A', muted: '#7A6448' }
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-bg text-text min-h-screen flex flex-col overflow-hidden transition-colors duration-300">

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="auth-card">
      <!-- Logo -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg" style="background: var(--accent);">
          🕵️
        </div>
        <h1 class="text-xl font-bold" style="color: var(--text);">注册 Prism</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary);">创建账号，开启情报之旅</p>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">邮箱</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">📧</span>
            <input
              type="email"
              id="email"
              placeholder="your@email.com"
              class="auth-input pl-10"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">密码</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">🔒</span>
            <input
              type="password"
              id="password"
              placeholder="至少 6 位字符"
              class="auth-input pl-10 pr-10"
              required
              minlength="6"
              autocomplete="new-password"
            >
            <button
              type="button"
              onclick="togglePasswordVisibility('password')"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text transition-colors"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Password Strength -->
          <div id="password-strength" class="mt-2 flex gap-1">
            <div class="h-1 flex-1 rounded bg-border"></div>
            <div class="h-1 flex-1 rounded bg-border"></div>
            <div class="h-1 flex-1 rounded bg-border"></div>
            <div class="h-1 flex-1 rounded bg-border"></div>
          </div>
          <p id="password-hint" class="text-xs mt-1 text-text-muted">密码强度：弱</p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">确认密码</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">🔒</span>
            <input
              type="password"
              id="confirm-password"
              placeholder="再次输入密码"
              class="auth-input pl-10"
              required
              autocomplete="new-password"
            >
          </div>
          <p id="password-match" class="text-xs mt-1 hidden text-error">两次密码不一致</p>
        </div>

        <!-- Invite Code (Optional) -->
        <div>
          <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">
            邀请码 <span class="text-text-muted">(可选)</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">🎫</span>
            <input
              type="text"
              id="invite-code"
              placeholder="输入邀请码获得额外次数"
              class="auth-input pl-10"
            >
          </div>
        </div>

        <!-- Terms -->
        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" class="w-4 h-4 mt-0.5 rounded border-border accent-accent" required>
          <label for="terms" class="text-sm" style="color: var(--text-secondary);">
            我已阅读并同意
            <a href="#" onclick="openLegalModal('terms'); return false;" class="text-accent hover:underline">用户协议</a>
            和
            <a href="#" onclick="openLegalModal('privacy'); return false;" class="text-accent hover:underline">隐私政策</a>
          </label>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden text-sm text-error bg-error/10 border border-error/20 rounded-lg p-3">
          <span id="error-text"></span>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="auth-btn auth-btn-primary"
        >
          <span id="submit-text">注册</span>
          <svg id="submit-spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-border"></div>
        <span class="text-xs text-text-muted">或</span>
        <div class="flex-1 h-px bg-border"></div>
      </div>

      <!-- OAuth Buttons -->
      <div class="space-y-3">
        <button
          onclick="loginWithGitHub()"
          class="auth-btn auth-btn-oauth flex items-center justify-center gap-3"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          使用 GitHub 注册
        </button>
      </div>

      <!-- Login Link -->
      <p class="text-center text-sm mt-6" style="color: var(--text-secondary);">
        已有账号？
        <a href="/login" class="text-accent font-medium hover:underline">立即登录</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        <span class="footer-brand">🕵️ Prism</span>
        <span class="footer-version">v2.1.0</span>
      </div>
      <div class="footer-right">
        <a href="/" class="footer-link">返回首页</a>
        <span class="footer-separator">·</span>
        <button onclick="toggleTheme()" class="footer-link">切换主题</button>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-bg-secondary border border-border px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 max-w-sm">
    <span id="toast-icon"></span>
    <span id="toast-message" class="text-sm font-medium"></span>
  </div>

  <!-- Legal Modal -->
  <div id="legal-modal" class="legal-modal">
    <div class="legal-modal-backdrop" onclick="closeLegalModal()"></div>
    <div class="legal-modal-content">
      <div class="legal-modal-header">
        <span class="legal-modal-icon">📜</span>
        <h2 class="legal-modal-title" id="legal-modal-title">法律条款</h2>
        <button class="legal-modal-close" onclick="closeLegalModal()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="legal-modal-body" id="legal-modal-body"></div>
    </div>
  </div>

  <script src="/static/core.js"></script>
  <script src="/static/legal.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    // Initialize theme
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Check if already logged in
      if (AuthState.isLoggedIn()) {
        window.location.href = '/';
      }

      // Password strength checker
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirm-password');

      passwordInput.addEventListener('input', checkPasswordStrength);
      confirmPasswordInput.addEventListener('input', checkPasswordMatch);
    });
  </script>
</body>
</html>
