<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OAuth 回调 - Prism</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: {
              DEFAULT: '#f8fafc',
              secondary: '#ffffff',
              tertiary: '#f1f5f9',
              dark: { DEFAULT: '#0a0a0f', secondary: '#141420', tertiary: '#1e1e2e' }
            },
            accent: { DEFAULT: '#7c5cfc', light: '#9b7dff', dark: '#6344d9' },
            success: '#00d4aa',
            error: '#ff6b6b',
            warn: '#ffaa44',
            border: { DEFAULT: 'var(--border)', light: '#cbd5e1', dark: 'var(--border)' },
            text: { DEFAULT: '#1e293b', secondary: '#64748b', muted: '#94a3b8', dark: { DEFAULT: '#f0f0f5', secondary: '#a0a0c0', muted: '#6a6a8a' }}
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-bg text-text min-h-screen flex flex-col overflow-hidden transition-colors duration-300">

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="auth-card text-center">
      <!-- Loading State -->
      <div id="loading-state">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 shadow-lg" style="background: linear-gradient(135deg, #7c5cfc, #00d4aa);">
          🕵️
        </div>
        <div class="flex items-center justify-center gap-3 mb-4">
          <svg class="w-6 h-6 animate-spin text-accent" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-lg font-medium" style="color: var(--text);">正在登录...</span>
        </div>
        <p class="text-sm" style="color: var(--text-secondary);">请稍候，正在处理 OAuth 回调</p>
      </div>

      <!-- Error State -->
      <div id="error-state" class="hidden">
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6" style="background: rgba(255,107,107,0.1);">
          ❌
        </div>
        <h2 class="text-lg font-medium mb-2" style="color: var(--text);">登录失败</h2>
        <p id="error-text" class="text-sm mb-6" style="color: var(--text-secondary);">OAuth 认证失败，请重试</p>
        <a href="/login" class="auth-btn auth-btn-primary inline-block">返回登录</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-left">
        <span class="footer-brand">🕵️ Prism</span>
        <span class="footer-version">v2.0.0</span>
      </div>
    </div>
  </footer>

  <script src="/static/core.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      
      // Parse OAuth callback
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      
      if (error) {
        showError('OAuth 授权被拒绝');
        return;
      }
      
      if (!code) {
        showError('无效的回调参数');
        return;
      }
      
      try {
        // Handle OAuth callback
        const result = await handleOAuthCallback(code, state);
        
        if (result.success) {
          // Redirect to home
          window.location.href = '/';
        } else {
          showError(result.message || 'OAuth 认证失败');
        }
      } catch (err) {
        showError(err.message || '网络错误，请重试');
      }
    });
    
    function showError(message) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('error-text').textContent = message;
    }
  </script>
</body>
</html>
